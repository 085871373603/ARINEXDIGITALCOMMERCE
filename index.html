<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arinex Digital Commerce - PPOB</title>
    
    <!-- Library CryptoJS untuk Cek ID PLN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        :root {
            --primary: #007bff; --primary-dark: #0056b3;
            --success: #28a745; --danger: #dc3545; --warning: #ffc107;
            --bg-color: #f4f7f6; --card-bg: #ffffff;
            --text-dark: #333333; --text-muted: #888888; --border-color: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); -webkit-user-select: none; user-select: none; touch-action: pan-y; }
        input { -webkit-user-select: text; user-select: text; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: var(--bg-color); min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .header { background-color: var(--primary); color: white; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; text-align: center; }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; opacity: 0.9; }
        .saldo-card { background: white; color: var(--text-dark); margin: -20px 20px 20px; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10; }
        .saldo-card .label { font-size: 0.8rem; color: var(--text-muted); }
        .saldo-card .amount { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .content { padding: 0 20px 20px; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .menu-item { background: var(--card-bg); padding: 15px 10px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent; }
        .menu-item.active { border-color: var(--primary); background-color: #eaf4ff; }
        .menu-item .icon { font-size: 24px; margin-bottom: 8px; }
        .menu-item .title { font-size: 0.8rem; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; outline: none; transition: border 0.3s; }
        .form-group input:focus { border-color: var(--primary); }
        .test-case-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; display: block; }
        .product-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .product-card:active { transform: scale(0.98); }
        .product-info h3 { font-size: 1rem; margin-bottom: 4px; }
        .product-info p { font-size: 0.8rem; color: var(--text-muted); }
        .product-price { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 480px; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 25px 20px; transform: translateY(100%); animation: slideUp 0.3s forwards; }
        @keyframes slideUp { to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .modal-body { margin-bottom: 25px; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .detail-row.total { font-weight: bold; font-size: 1.1rem; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border-color); }
        
        .btn { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:active { background-color: var(--primary-dark); }
        .btn:disabled { background-color: #888; cursor: not-allowed; }
        .btn-warning { background-color: var(--warning); color: #333; margin-top: 10px; padding: 10px; }
        
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 320px; z-index: 200; display: none; }
        .alert-box.active { display: block; }
        .alert-icon { font-size: 40px; margin-bottom: 10px; }
        .alert-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .alert-message { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; word-wrap: break-word;}
        .alert-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        
        .inquiry-box { display: none; margin-top: 10px; padding: 15px; background: #eaf4ff; border-radius: 10px; font-size: 0.9rem; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Arinex PPOB</h1>
        <p>Production Mode (VPS IP Statis + Firebase)</p>
    </div>

    <div class="saldo-card">
        <div>
            <div class="label">Sisa Saldo Digiflazz</div>
            <div class="amount" id="saldo-display">Menunggu Transaksi...</div>
        </div>
        <div style="font-size: 24px;">💰</div>
    </div>

    <div class="content">
        <div class="menu-grid">
            <div class="menu-item active" id="menu-pulsa" onclick="pilihKategori('pulsa')">
                <div class="icon">📱</div>
                <div class="title">Pulsa/Data</div>
            </div>
            <div class="menu-item" id="menu-pln" onclick="pilihKategori('pln')">
                <div class="icon">⚡</div>
                <div class="title">Tagihan PLN</div>
            </div>
            <div class="menu-item" id="menu-pdam" onclick="pilihKategori('pdam')">
                <div class="icon">🚰</div>
                <div class="title">PDAM</div>
            </div>
        </div>

        <div class="form-group">
            <label id="input-label">Nomor HP</label>
            <input type="number" id="input-nomor" placeholder="Contoh: 087800001230" value="087800001230">
            <span class="test-case-hint" id="hint-text">Gunakan 087800001230 untuk memicu Sukses.</span>
            
            <button id="btn-inquiry" class="btn btn-warning" style="display: none;" onclick="cekInquiryPLN()">Cek Data Pelanggan</button>
            <div id="inquiry-result" class="inquiry-box"></div>
        </div>

        <div id="product-container" class="product-list"></div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Konfirmasi Pembayaran</h3>
            <span style="font-size: 1.2rem; cursor: pointer;" onclick="tutupModal()">✖</span>
        </div>
        <div class="modal-body">
            <div class="detail-row"><span>Nomor Tujuan</span><span id="confirm-no"></span></div>
            <div class="detail-row"><span>Produk</span><span id="confirm-produk"></span></div>
            <div class="detail-row total"><span>Total Bayar</span><span id="confirm-harga"></span></div>
        </div>
        <button class="btn" id="btn-bayar" onclick="prosesBayarAPI()">Kirim via VPS Arinex</button>
    </div>
</div>

<div class="modal-overlay" id="alert-overlay"></div>
<div class="alert-box" id="custom-alert">
    <div class="alert-icon" id="alert-icon">✅</div>
    <div class="alert-title" id="alert-title">Berhasil</div>
    <div class="alert-message" id="alert-message">Detail transaksi</div>
    <button class="alert-btn" id="alert-btn" onclick="tutupAlert()">Tutup</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBZMPSEQhCgM8vvEbotEO5Ck15VpuFXHY4",
        authDomain: "server-323.firebaseapp.com",
        databaseURL: "https://server-323-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "server-323",
        storageBucket: "server-323.firebasestorage.app",
        messagingSenderId: "411152653914",
        appId: "1:411152653914:web:b18b9e8ca95067a431c263",
        measurementId: "G-GMV84KYD7S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ENDPOINT VPS IP STATIS MILIK KAKAK
    const URL_SERVER_VPS = "http://203.145.35.190:3000/api/transaction";

    const databaseProduk = {
        pulsa: [{ kode: 'xld10', nama: 'XL Pulsa 10.000', harga: 10500, deskripsi: 'Prepaid Test Case' }],
        pln: [{ kode: 'pln', nama: 'Tagihan PLN Postpaid', harga: 11000, deskripsi: 'Postpaid Test Case' }],
        pdam: [{ kode: 'pdam', nama: 'Tagihan PDAM', harga: 12500, deskripsi: 'Postpaid Test Case' }]
    };

    let kategoriAktif = 'pulsa';
    let produkTerpilih = null;

    function formatRupiah(angka) { return 'Rp ' + parseInt(angka).toLocaleString('id-ID'); }

    window.pilihKategori = function(kategori) {
        kategoriAktif = kategori;
        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        document.getElementById('menu-' + kategori).classList.add('active');

        const label = document.getElementById('input-label');
        const input = document.getElementById('input-nomor');
        const hint = document.getElementById('hint-text');
        const btnInquiry = document.getElementById('btn-inquiry');
        const resInquiry = document.getElementById('inquiry-result');
        
        resInquiry.style.display = 'none';

        if (kategori === 'pln') {
            label.innerText = 'ID Pelanggan PLN'; input.placeholder = 'Contoh: 530000000001';
            hint.innerText = 'Gunakan 530000000001 untuk Sukses.'; btnInquiry.style.display = 'block'; 
        } else if (kategori === 'pdam') {
            label.innerText = 'Nomor Meter PDAM'; input.placeholder = 'Contoh: 1013225';
            hint.innerText = 'Gunakan 1013225 untuk Sukses.'; btnInquiry.style.display = 'none';
        } else {
            label.innerText = 'Nomor HP'; input.placeholder = 'Contoh: 087800001230';
            hint.innerText = 'Gunakan 087800001230 untuk Sukses.'; btnInquiry.style.display = 'none';
        }
        renderProduk();
    };

    window.bukaModal = function(item) {
        const nomor = document.getElementById('input-nomor').value;
        if (!nomor) { tampilkanAlert('Peringatan', 'Mohon isi nomor tujuan!', 'error'); return; }
        produkTerpilih = item;
        document.getElementById('confirm-no').innerText = nomor;
        document.getElementById('confirm-produk').innerText = `${item.nama} (${item.kode})`;
        document.getElementById('confirm-harga').innerText = formatRupiah(item.harga);
        document.getElementById('modal').classList.add('active');
    };

    window.tutupModal = function() {
        document.getElementById('modal').classList.remove('active'); produkTerpilih = null;
    };

    window.tutupAlert = function() {
        document.getElementById('alert-overlay').classList.remove('active');
        document.getElementById('custom-alert').classList.remove('active');
    };

    function renderProduk() {
        const container = document.getElementById('product-container'); container.innerHTML = ''; 
        databaseProduk[kategoriAktif].forEach(item => {
            const card = document.createElement('div'); card.className = 'product-card';
            card.onclick = () => window.bukaModal(item);
            card.innerHTML = `<div class="product-info"><h3>${item.nama}</h3><p>${item.deskripsi}</p></div><div class="product-price">${formatRupiah(item.harga)}</div>`;
            container.appendChild(card);
        });
    }

    function tampilkanAlert(judul, pesan, tipe) {
        const overlay = document.getElementById('alert-overlay'); const box = document.getElementById('custom-alert');
        const icon = document.getElementById('alert-icon'); const title = document.getElementById('alert-title');
        const message = document.getElementById('alert-message'); const btn = document.getElementById('alert-btn');

        overlay.classList.add('active'); box.classList.add('active');
        title.innerText = judul; message.innerHTML = pesan;

        if (tipe === 'success') { icon.innerText = '✅'; btn.className = 'alert-btn btn-success'; } 
        else if (tipe === 'pending') { icon.innerText = '⏳'; btn.className = 'alert-btn btn-warning'; } 
        else { icon.innerText = '❌'; btn.className = 'alert-btn btn-danger'; }
    }

    // FUNGSI INQUIRY MENGGUNAKAN KREDENSIAL PRODUCTION
    window.cekInquiryPLN = async function() {
        const nomor = document.getElementById('input-nomor').value;
        const btnInq = document.getElementById('btn-inquiry');
        const resDiv = document.getElementById('inquiry-result');

        if(!nomor) { tampilkanAlert('Gagal', 'Masukkan ID Pelanggan PLN!', 'error'); return; }
        btnInq.innerText = "Mengecek ID..."; btnInq.disabled = true;

        const DIGIFLAZZ_USERNAME = "jecedogOq0PD";
        const DIGIFLAZZ_API_KEY = "80b06c9c-8816-5b70-bf87-10c1639c8188";
        const signString = DIGIFLAZZ_USERNAME + DIGIFLAZZ_API_KEY + nomor;
        const signHash = CryptoJS.MD5(signString).toString();
        const payload = { username: DIGIFLAZZ_USERNAME, customer_no: nomor, sign: signHash };

        try {
            const response = await fetch("https://corsproxy.io/?https://api.digiflazz.com/v1/inquiry-pln", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
            });
            const result = await response.json();
            resDiv.style.display = "block";
            if(result.data && result.data.rc === "00") {
                const d = result.data;
                resDiv.innerHTML = `<b>ID Ditemukan!</b><br>Nama: ${d.name || '-'}<br>Daya: ${d.segment_power || '-'}<br>No Meter: ${d.meter_no || d.customer_no}`;
                resDiv.style.borderColor = "var(--success)";
            } else {
                resDiv.innerHTML = `<b style="color:var(--danger)">Gagal:</b> ${result.data ? result.data.message : 'ID Tidak valid'}`;
                resDiv.style.borderColor = "var(--danger)";
            }
        } catch(e) {
            resDiv.style.display = "block"; resDiv.innerHTML = `<b style="color:var(--danger)">Gagal Koneksi:</b> Periksa jaringan internet Anda.`;
        }
        btnInq.innerText = "Cek Data Pelanggan"; btnInq.disabled = false;
    };

    async function simpanKeFirebase(dataTx) {
        try {
            const dbRef = ref(db, 'riwayat_transaksi');
            const newTxRef = push(dbRef); 
            await set(newTxRef, {
                ref_id: dataTx.ref_id, customer_no: dataTx.customer_no, kode_produk: dataTx.buyer_sku_code,
                harga: dataTx.price || 0, status: dataTx.status, pesan_api: dataTx.message, rc: dataTx.rc,
                waktu_transaksi: serverTimestamp() 
            });
        } catch (error) { console.error("Gagal menyimpan ke Firebase:", error); }
    }

    // TRANSAKSI MENEMBAK KE VPS IP STATIS (PORT 3000)
    window.prosesBayarAPI = async function() {
        const btn = document.getElementById('btn-bayar');
        const nomor = document.getElementById('input-nomor').value;
        const kodeProduk = produkTerpilih.kode;
        
        btn.innerText = "Memproses di VPS Arinex...";
        btn.disabled = true;

        const refId = "TEST-" + Math.floor(Math.random() * 1000000000).toString();

        const payload = {
            buyer_sku_code: kodeProduk,
            customer_no: nomor,
            ref_id: refId
        };

        try {
            const response = await fetch(URL_SERVER_VPS, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            window.tutupModal();
            
            if (result && result.data) {
                const data = result.data;
                if(data.buyer_last_saldo) document.getElementById('saldo-display').innerText = formatRupiah(data.buyer_last_saldo);

                await simpanKeFirebase(data);

                const msgHtml = `
                    <b>Tujuan:</b> ${data.customer_no}<br>
                    <b>Pesan:</b> ${data.message}<br>
                    <b>Status:</b> ${data.status} (RC: ${data.rc})<br>
                    <small>Ref: ${data.ref_id}</small><br>
                    <br><i style="color:var(--success); font-size:0.8rem">✅ Transaksi sukses via VPS IP Statis</i>
                `;

                if (data.rc === "00") tampilkanAlert('Transaksi Sukses!', msgHtml, 'success');
                else if (data.rc === "03") tampilkanAlert('Status Pending', msgHtml, 'pending');
                else tampilkanAlert('Transaksi Gagal', msgHtml, 'error');
            } else {
                window.tutupModal();
                const errMsg = result.data ? result.data.message : (result.error || 'Terjadi kesalahan sistem');
                tampilkanAlert('Gagal', errMsg, 'error');
            }

        } catch (error) {
            window.tutupModal();
            const errorMsg = `Gagal Koneksi VPS.<br><small><i>${error.message}</i></small>`;
            tampilkanAlert('Koneksi Gagal', errorMsg, 'error');
        } finally {
            btn.innerText = "Kirim via VPS Arinex";
            btn.disabled = false;
        }
    };

    renderProduk();
</script>
</body>
</html>
